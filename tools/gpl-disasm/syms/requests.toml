# gpl-disasm symbol catalogue — REQUEST codes for `gpl request` (0x22).
#
# Each row names one REQUEST code the host dispatches on. Decoration
# is JSON-only: `Symbols::apply` writes the name into the instruction's
# `request_name` field (and the first param's code is what matched);
# the text listing is unchanged so gpl-asm can still re-parse it.
#
# Provenance: Calvin Rodo's yuan-ti `GplRequests.cs` (MIT; the
# community catalogue the yuan-ti host dispatches on), imported
# verbatim-in-meaning and curated here. Effect detail lives in the
# credited upstream writeup (`docs/reports/community-crossread-2026-11-13.md`
# and yuan-ti's dsun-exe-reference.md); `doc` here carries the
# one-line summaries. See CREDITS.md "Community contributions".
#
# Curation rule (matching opcodes.toml's spirit): rows come from the
# credited catalogue; adding rows beyond it needs handler evidence.

[[request]]
code = 1
name = "REST_RAISE"
doc = "the party rests; fallen members get up too"

