# OpenDS repro harness — Dark Sun: Shattered Lands (GOG 1.10)
#
# This is the static base config; mounts and launch commands
# are injected per-invocation by repro.py via `-c` arguments.
# Tested with dosbox-staging 0.82.x on Fedora 44.

[sdl]
fullscreen   = false
# Opens a real window on the user's Wayland (or X) session.
# DOSBox-Staging probes OpenGL at init regardless of `output`,
# so SDL_VIDEODRIVER=dummy is unsupported. Run interactively.
output       = opengl
window_decorations = true
priority     = auto,auto
mouse_capture_modes = onclick

[dosbox]
machine      = svga_s3
memsize      = 16

[cpu]
core         = auto
cputype      = auto
cycles       = fixed 30000

[render]
aspect       = false

[mixer]
# Audio must initialise even on headless runs: DSUN.EXE's
# embedded MEL (Miles Audio Library) layer aborts on MIDI
# detect-fail and exits with "Mel Fatal Error #25 Trap #16".
# Keep the MPU401 mock alive; volume is irrelevant for repro.
nosound      = false
rate         = 22050
blocksize    = 1024
prebuffer    = 25

[sblaster]
sbtype       = sb16
sbbase       = 220
irq          = 7
dma          = 1
hdma         = 5

[midi]
mpu401       = intelligent
mididevice   = none

[sdl]
windowresolution = 960x600
glshader = none
mouse_capture = seamless
captures = /tmp/ds1-caps

[autoexec]
autotype -w 24 enter
autotype -w 44 l
autotype -w 56 escape
autotype -w 62 c
autotype -w 74 escape
autotype -w 80 s
autotype -w 88 enter
autotype -w 96 enter
autotype -w 104 enter
autotype -w 116 enter
autotype -w 124 v
autotype -w 134 escape
autotype -w 136 i
autotype -w 146 escape
autotype -w 148 u
autotype -w 158 escape
autotype -w 160 tab
autotype -w 170 escape
mount c /tmp/ds1-oracle
mount d /tmp/ds1-d
c:
DSUN.EXE > d:\dsun.log
# Intentionally empty. repro.py injects:
#   mount c <game-dir>
#   mount d <scratch-dir>
#   c:
#   <trigger commands>
#   exit
