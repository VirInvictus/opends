name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stacked pushes supersede each other's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust — fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pure-Rust workspace: clap/anyhow/serde/toml/png (png pulls flate2 +
    # miniz_oxide, both pure Rust). No system libraries to install.
    env:
      RUSTFLAGS: -D warnings
    steps:
      # SHA-pinned refs (dependabot manages the bumps); release.yml
      # grants contents:write, so floating refs are not acceptable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # Corpus tests read GFFs from `.games/` (gitignored, never
        # redistributed); absent on CI, they skip silently and only the
        # tracked-fixture unit + smoke tests run.
        run: cargo test --workspace

  python:
    name: python — ruff + compile (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 3.11 is the declared floor (spec 7a: tomllib); 3.14 is the
        # dev machine. The floor used to be exercised only at
        # zip-build time; both legs now run the whole gate.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install ruff==0.15.20

      - name: ruff check
        # The root ruff.toml pins required-version to this same
        # 0.15.20 and sets the py311 target, so a newer local ruff
        # refuses instead of silently diverging from CI.
        run: ruff check tools ds1-patch ds2-patch

      - name: ruff format --check
        run: ruff format --check tools ds1-patch ds2-patch

      - name: compile check
        # Stdlib-only single-file tools; no unittest/pytest suite exists,
        # so byte-compilation is the syntax gate. Both patch halves are
        # player-distributed (apply.py, darkfix/, fixes/*.py in each);
        # they ship in every zip and gate like the tools do.
        run: python -m compileall -q tools ds1-patch ds2-patch

      - name: tool selftests
        # The --selftest flag is the repo's Python test idiom (decided
        # 2026-09-06, backlog: each tool's selftest runs its synthetic
        # fixtures and refusal paths everywhere; corpus-dependent parts
        # skip when .games/ is absent, by design).
        run: |
          python3 tools/ovr-map/ovr-map.py --selftest
          python3 tools/exe-patch/exe-patch.py --selftest
          python3 tools/repro/repro.py --selftest
          python3 ds1-patch/scripts/apply.py --selftest
          python3 ds2-patch/scripts/apply.py --selftest
          python3 tools/gpl-disasm/scripts/global-state-sweep.py --selftest
          python3 tools/gpl-disasm/scripts/dead-trigger-sweep.py --selftest
          python3 tools/verify-install/verify-install.py --selftest
