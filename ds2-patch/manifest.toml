# darkfix-ds2 patch manifest. Schema version 1 (spec.md §4).
#
# The patch version lives in this directory's VERSION file
# (docs/versioning.md); it is never duplicated here.
#
# No fix ships yet (see README: pre-release). The target hash below
# is already canonical: the applier refuses to run against any other
# engine build, and authoring-time checks (`apply.py --check-all`)
# compare the whole install against docs/source-hashes/ds2-gog-1.10.toml.

[meta]
schema_version = 1
game = "ds2"
name = "darkfix-ds2"
license = "MIT"
homepage = "https://github.com/VirInvictus/opends"

[target]
source = "GOG"
engine_version = "1.10"
# Canonical full-install hash manifest, repo-relative. Authoring-time
# only (`apply.py --check-all`): a distributed zip does not ship
# docs/, and the applier must not depend on it.
reference_manifest = "docs/source-hashes/ds2-gog-1.10.toml"

[target.files]
# Every file at least one enabled fix touches, hashed on the
# canonical GOG 1.10 install (docs/source-hashes/ds2-gog-1.10.toml).
# The applier refuses to run when any of these differ: wrong engine
# build, already-patched file, or damaged install.
"DSUN.EXE" = "ce02ee1f31c2339fc3e16926e370639af782a5ecd6c8a6081140fa23445fc92c"

# The ordered fix list. Empty until Phase 7; entries follow the ds1
# shape ([[fixes]] with id, path, enabled).
