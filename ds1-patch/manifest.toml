# darkfix-ds1 patch manifest. Schema version 1 (spec.md §4).
#
# The patch version lives in this directory's VERSION file
# (docs/versioning.md); it is never duplicated here.

[meta]
schema_version = 1
game = "ds1"
name = "darkfix-ds1"
license = "MIT"
homepage = "https://github.com/VirInvictus/opends"

[target]
source = "GOG"
engine_version = "1.10"
# Canonical full-install hash manifest, repo-relative. Authoring-time
# only (`apply.py --check-all`): a distributed zip does not ship
# docs/, and the applier must not depend on it.
reference_manifest = "docs/source-hashes/ds1-gog-1.10.toml"

[target.files]
# Every file at least one enabled fix touches, hashed on the
# canonical GOG 1.10 install (docs/source-hashes/ds1-gog-1.10.toml).
# The applier refuses to run when any of these differ: wrong engine
# build, already-patched file, or damaged install.
"DSUN.EXE" = "7bbd84f105b1ebe538a4abdfccdb2bacbf5b4fa763b45fa3a84499780f1d8c96"
"GPLDATA.GFF" = "405fdadcf703b9ac15d05735e0a74cb41419e9178c6aced9f02538314dd6eb04"

[[fixes]]
id = "fix.ds1.noop"
path = "fixes/000-noop.py"
enabled = true

[[fixes]]
id = "fix.ds1.deadtriggers"
path = "fixes/001-deadtriggers.py"
enabled = true

# Enabled by default (2026-10-07): the spec 5 composition amendment
# lets disjoint same-file fixes apply together, so both GPLDATA.GFF
# fixes ship on. The applier composes them into one write and still
# refuses any range overlap at check time.
[[fixes]]
id = "fix.ds1.script-repairs"
path = "fixes/002-script-repairs.py"
enabled = true

# ---- 0.2.0-beta.1 community fixes -----------------------------------
# Calvin Rodo's yuan-ti repairs, adopted through the gate
# (docs/gate-review-yuan-ti-2026-11-13.md: fingerprints, semantic
# review, assemble check all pass; runtime QA pending). EVERY fix
# below ships DISABLED: this is an explicitly untested beta, so no
# one gets new behavior without opting in. Enable in this file (or
# per-run) and follow docs/qa-packet-ds1-script-repairs-beta.md.
# The Legcrusher dialog guards are not in this beta: they are
# runtime-assembled upstream and need our gpl-asm movable
# assembly mode first (see the beta release notes).

[[fixes]]
id = "fix.ds1.halfling-race"
path = "fixes/003-halfling-race.py"
enabled = false

[[fixes]]
id = "fix.ds1.tracking"
path = "fixes/004-tracking-chain.py"
enabled = false

[[fixes]]
id = "fix.ds1.grate-hack"
path = "fixes/005-grate-hack.py"
enabled = false

[[fixes]]
id = "fix.ds1.serf-follow"
path = "fixes/006-serf-follow.py"
enabled = false

[[fixes]]
id = "fix.ds1.messenger-trigger"
path = "fixes/007-messenger-trigger.py"
enabled = false

[[fixes]]
id = "fix.ds1.mindhome-award"
path = "fixes/008-mindhome-award.py"
enabled = false
